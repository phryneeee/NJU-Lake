<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1536">
  <defs>
    <radialGradient id="vig" cx="50%" cy="45%" r="80%">
      <stop offset="40%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- 镜湖对岸：一面墙劈开两个时代 -->
  <rect width="2048" height="768" fill="#4a3d2c"/>
  <rect y="768" width="2048" height="768" fill="#1f3328"/>

  <!-- 上半：2001 鼓楼老图书馆（暖褐） -->
  <g>
    <rect y="0" width="2048" height="70" fill="#2e2418"/>
    <!-- 老木书架 -->
    <g>
      <rect x="660" y="120" width="740" height="600" fill="#3a2e20"/>
      <g fill="#2c2318">
        <rect x="680" y="140" width="700" height="14"/><rect x="680" y="290" width="700" height="14"/>
        <rect x="680" y="440" width="700" height="14"/><rect x="680" y="590" width="700" height="14"/>
      </g>
      <g fill="#a98e6f">
        <rect x="700" y="170" width="100" height="110"/><rect x="820" y="170" width="100" height="110"/>
        <rect x="940" y="170" width="100" height="110"/><rect x="1060" y="170" width="100" height="110"/>
        <rect x="1180" y="170" width="100" height="110"/><rect x="1280" y="170" width="90" height="110"/>
        <rect x="700" y="320" width="100" height="110"/><rect x="820" y="320" width="100" height="110"/>
        <rect x="1060" y="320" width="100" height="110"/><rect x="1180" y="320" width="100" height="110"/>
        <rect x="700" y="470" width="100" height="110"/><rect x="940" y="470" width="100" height="110"/>
        <rect x="1060" y="470" width="100" height="110"/><rect x="1280" y="470" width="90" height="110"/>
      </g>
      <!-- 梯子靠在架边 -->
      <g stroke="#75603f" stroke-width="12">
        <line x1="1420" y1="720" x2="1500" y2="200"/><line x1="1480" y1="720" x2="1560" y2="200"/>
        <line x1="1438" y1="620" x2="1496" y2="626"/><line x1="1452" y1="520" x2="1510" y2="526"/>
        <line x1="1466" y1="420" x2="1524" y2="426"/><line x1="1480" y1="320" x2="1538" y2="326"/>
      </g>
    </g>
    <!-- 2001的窗：白昼梧桐 -->
    <rect x="240" y="140" width="320 " height="380" fill="#2e2418"/>
    <rect x="256" y="156" width="288" height="348" fill="#d9c5a0"/>
    <g fill="#b0a079">
      <circle cx="330" cy="280" r="60"/><circle cx="420" cy="240" r="70"/><circle cx="470" cy="320" r="50"/>
      <rect x="390" y="300" width="16" height="204"/>
    </g>
    <rect x="392" y="156" width="14" height="348" fill="#2e2418"/>
    <text x="400" y="620" font-family="serif" font-size="30" fill="#d8c8a8" text-anchor="middle" opacity="0.8">2001 · 鼓楼</text>
  </g>

  <!-- 中缝：还书箱 -->
  <g>
    <rect y="730" width="2048" height="76" fill="#1c1a17"/>
    <rect x="924" y="700" width="200" height="140" rx="14" fill="#2c2318"/>
    <rect x="944" y="720" width="160" height="100" rx="10" fill="#3a2e20"/>
    <rect x="964" y="756" width="120" height="30" fill="#0e0c09"/>
    <rect x="940" y="690" width="168" height="24" fill="#b08d3f"/>
    <text x="1024" y="710" font-family="serif" font-size="22" fill="#3a3326" text-anchor="middle">还 书 箱</text>
    <!-- 两侧的微光对流 -->
    <g fill="#e8c84a" opacity="0.5">
      <circle cx="880" cy="760" r="6"/><circle cx="840" cy="746" r="4"/>
    </g>
    <g fill="#7FD4C1" opacity="0.5">
      <circle cx="1170" cy="780" r="6"/><circle cx="1210" cy="792" r="4"/>
    </g>
  </g>

  <!-- 下半：2026 第七档案库（冷绿） -->
  <g>
    <!-- 同一排书架的镜像位置：绿柜 -->
    <rect x="660" y="850" width="740 " height="520" fill="#26352c"/>
    <g fill="#3E5C4B">
      <rect x="690" y="880" width="150" height="130"/><rect x="860" y="880" width="150" height="130"/>
      <rect x="1030" y="880" width="150" height="130"/><rect x="1200" y="880" width="150" height="130"/>
      <rect x="690" y="1030" width="150" height="130"/><rect x="860" y="1030" width="150" height="130"/>
      <rect x="1030" y="1030" width="150" height="130"/><rect x="1200" y="1030" width="150" height="130"/>
      <rect x="690" y="1180" width="150" height="130"/><rect x="860" y="1180" width="150" height="130"/>
      <rect x="1030" y="1180" width="150" height="130"/><rect x="1200" y="1180" width="150" height="130"/>
    </g>
    <g fill="#b08d3f">
      <rect x="740" y="938" width="44" height="10"/><rect x="910" y="938" width="44" height="10"/>
      <rect x="1080" y="938" width="44" height="10"/><rect x="1250" y="938" width="44" height="10"/>
      <rect x="740" y="1088" width="44" height="10"/><rect x="910" y="1088" width="44" height="10"/>
      <rect x="1080" y="1088" width="44" height="10"/><rect x="1250" y="1088" width="44" height="10"/>
      <rect x="740" y="1238" width="44" height="10"/><rect x="910" y="1238" width="44" height="10"/>
      <rect x="1080" y="1238" width="44" height="10"/><rect x="1250" y="1238" width="44" height="10"/>
    </g>
    <!-- 锈死的抽屉：右下一格泛红 -->
    <rect x="1200" y="1180" width="150" height="130" fill="#4a4438"/>
    <g fill="#8C3B2E" opacity="0.7">
      <circle cx="1240" cy="1220" r="9"/><circle cx="1300" cy="1260" r="12"/><circle cx="1270" cy="1290" r="7"/>
    </g>
    <text x="400" y="1100" font-family="serif" font-size="30" fill="#7FD4C1" text-anchor="middle" opacity="0.8">2026 · B7</text>
    <!-- 手电筒搁在地上 -->
    <g transform="rotate(-10 420 1280)">
      <rect x="360" y="1260" width="120" height="40" rx="16" fill="#3a4042"/>
      <rect x="470" y="1252" width="30" height="56" rx="8" fill="#52606a"/>
      <polygon points="500,1256 600,1230 600,1330 500,1304" fill="#e8dcc0" opacity="0.25"/>
    </g>
  </g>

  <!-- 右侧门（热区 1700,560,260,480 跨中缝） -->
  <g>
    <rect x="1690" y="540" width="280 " height="560" fill="#10130f"/>
    <rect x="1708" y="558" width="244" height="542" fill="#2c3a30"/>
    <rect x="1730" y="590" width="200" height="170" fill="#243028"/>
    <circle cx="1916" cy="830" r="13" fill="#b08d3f"/>
  </g>

  <!-- 左下角的水缘（热区 300,1100,520,240）：来时的湖还跟着 -->
  <g>
    <path d="M 80 1300 q 260 -80 560 -20 q 60 120 -40 200 l -520 56 z" fill="#16202a"/>
    <g stroke="#26323e" stroke-width="5" fill="none">
      <path d="M 200 1360 q 70 -14 140 0"/><path d="M 380 1420 q 80 -16 160 0"/>
    </g>
    <!-- 水里一片橙色鳞光 -->
    <ellipse cx="330" cy="1390" rx="40" ry="12" fill="#c98a4b" opacity="0.6"/>
  </g>

  <rect width="2048" height="1536" fill="url(#vig)"/>
</svg>
