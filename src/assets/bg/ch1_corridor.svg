<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1536">
  <defs>
    <radialGradient id="vig" cx="50%" cy="46%" r="75%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.42"/>
    </radialGradient>
  </defs>

  <!-- 墙与地面 -->
  <rect width="2048" height="1536" fill="#6e5b41"/>
  <rect y="0" width="2048" height="130" fill="#3a2f22"/>
  <rect y="130" width="2048" height="18" fill="#574733"/>
  <rect y="880" width="2048" height="230" fill="#4a3b2a"/>
  <rect y="880" width="2048" height="14" fill="#3a2e20"/>
  <g fill="#3a2e20" opacity="0.5">
    <rect x="120" y="910" width="10" height="180"/><rect x="420" y="910" width="10" height="180"/>
    <rect x="720" y="910" width="10" height="180"/><rect x="1320" y="910" width="10" height="180"/>
    <rect x="1620" y="910" width="10" height="180"/><rect x="1920" y="910" width="10" height="180"/>
  </g>
  <rect y="1110" width="2048" height="426" fill="#38302a"/>
  <g fill="#2e2722">
    <rect y="1180" width="2048" height="8"/><rect y="1280" width="2048" height="8"/>
    <rect y="1400" width="2048" height="8"/>
  </g>

  <!-- 左侧木格窗：午后光 -->
  <g>
    <rect x="150" y="300" width="400" height="560" fill="#2e2418"/>
    <rect x="170" y="320" width="360" height="520" fill="#e3d3ae"/>
    <!-- 窗外树影 -->
    <g fill="#b9a982">
      <circle cx="260" cy="430" r="70"/><circle cx="330" cy="380" r="55"/><circle cx="420" cy="450" r="80"/>
      <rect x="300" y="430" width="14" height="410"/>
    </g>
    <!-- 木格 -->
    <g fill="#2e2418">
      <rect x="340" y="320" width="20" height="520"/>
      <rect x="170" y="480" width="360" height="20"/>
      <rect x="170" y="660" width="360" height="20"/>
      <rect x="255" y="320" width="10" height="520"/><rect x="435" y="320" width="10" height="520"/>
    </g>
    <!-- 窗台上的乌鸦剪影 -->
    <g fill="#1c1a17">
      <ellipse cx="470" cy="828" rx="36" ry="22"/>
      <circle cx="500" cy="806" r="14"/>
      <polygon points="512,804 538,810 512,816"/>
      <rect x="455" y="845" width="4" height="14"/><rect x="478" y="845" width="4" height="14"/>
    </g>
    <rect x="140" y="852" width="420" height="20" fill="#2e2418"/>
