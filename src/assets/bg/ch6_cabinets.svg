  </g>

  <!-- B∞ 电梯面板（热区 1700,1160,280,220） -->
  <g>
    <rect x="1700" y="1150" width="280" height="240" fill="#1a1a1e"/>
    <rect x="1716" y="1166" width="248" height="208" fill="#2c2c30"/>
    <g fill="#1a1a1e" stroke="#b08d3f" stroke-width="3">
      <circle cx="1780" cy="1220" r="18"/><circle cx="1840" cy="1220" r="18"/><circle cx="1900" cy="1220" r="18"/>
      <circle cx="1780" cy="1280" r="18"/><circle cx="1840" cy="1280" r="18"/><circle cx="1900" cy="1280" r="18"/>
    </g>
    <circle cx="1840" cy="1336" r="22" fill="#10130f" stroke="#7FD4C1" stroke-width="4"/>
    <text x="1840" y="1345" font-family="serif" font-size="22" fill="#7FD4C1" text-anchor="middle">∞</text>
  </g>

  <rect width="2048" height="1536" fill="url(#vig)"/>
